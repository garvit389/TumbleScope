# CP3a provisional operating values. These are not empirically calibrated.
# CP3a remains BLOCKED pending P1's threshold selection under CONTRACTS.md
# Sections 17 and 21. The reproducible diagnostic sensitivity pilot is in
# tests/p1/test_reconcile_recovery.py; it does not establish a selection target.
# Treat one resolution element as the initial clustering and alias-match scale.
cluster_tol_resolutions: 1.0
harmonic_ratio_tolerance: 0.03
alias_tol_resolutions: 1.0
alias_min_source_support: 0.5

# Start with equal estimator weights and a smaller penalty for window evidence.
# Tune on validation data at CP4.
w_C: 0.3333333333333333
w_L: 0.3333333333333333
w_D: 0.3333333333333333
lambda_A: 0.2

# Start with two observed repeats and require half of ten phase bins to be
# populated by at least two valid samples. Calibrate on synthetic recovery.
min_cycles: 2.0
max_rel_period_uncertainty: 0.5
n_phase_bins: 10
min_points_per_bin: 2
min_phase_coverage: 0.5
min_separation_resolutions: 1.5

# Standalone default. The controller injects 3 in Fast mode.
top_k: 5
